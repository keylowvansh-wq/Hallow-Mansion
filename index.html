<html>
<head>
<link rel="stylesheet" href="style.css">
<title>Blackwood Manor Tickets</title>
</head>
<body>
<div id="cursor"></div>
<div id="head">
<h1>BLACKWOOD MANOR</h1>
<h3>ALL HALLOWS' EVE EXPERIENCE</h3>
</div>
<div id="main">
<div id="formBox">
<h2>RESERVE YOUR NIGHTMARE</h2>
<div class="row">
<label>Full Name:</label>
<input type="text" id="fname" placeholder="John Doe">
</div>
<div class="row">
<label>Date:</label>
<select id="date">
<option>Oct 29</option>
<option>Oct 30</option>
<option selected>Oct 31 (Halloween)</option>
</select>
</div>
<div class="row">
<label>Time:</label>
<select id="time">
<option>8:00 PM</option>
<option>10:00 PM</option>
<option>12:00 AM (Midnight)</option>
</select>
</div>
<button id="nextBtn" onclick="nextStep()">CONTINUE</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
